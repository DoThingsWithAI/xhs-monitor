name: Build and test MVP
on:
  push:
    paths: ['apps/**','packages/**','scripts/admin-init.ts','scripts/check-sales.py','tests/**','package.json','tsconfig.json','next-env.d.ts','deploy/**','.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-24.04
    env:
      DB_PATH: /tmp/xhs-monitor-test.sqlite
      SESSION_SECRET: example-test-session-secret-with-more-than-40-characters-123456
      APP_DOMAIN: localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: python3 -m py_compile scripts/check-sales.py
      - run: npm test
      - run: npm run db:init
      - run: npm run typecheck
      - run: npm run build
      - name: Docker image build smoke (web)
        run: docker build -f deploy/Dockerfile.web -t xhs-monitor-web:test .
      - name: Docker image build smoke (worker)
        run: docker build -f deploy/Dockerfile.worker -t xhs-monitor-worker:test .
      - name: Chromium DOM hydration smoke (worker image)
        # GitHub Ubuntu runners restrict unprivileged user namespaces via AppArmor.
        # Apply the same Chromium seccomp allowlist as production. The runner-only
        # AppArmor override lets Chromium's own sandbox (chromiumSandbox:true) start;
        # no access to the network is needed by this synthetic DOM fixture.
        run: |
          docker run --rm --network none \
            --security-opt "seccomp=$PWD/deploy/seccomp_profile.json" \
            --security-opt apparmor=unconfined \
            --entrypoint npm xhs-monitor-worker:test run worker:smoke
      - name: Validate Compose config
        run: |
          cp .env.example .env
          sed -i 's/^APP_DOMAIN=.*/APP_DOMAIN=example.com/' .env
          docker compose -p xhs-monitor --env-file .env -f deploy/compose.yaml config --quiet
