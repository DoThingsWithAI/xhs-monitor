name: xhs-monitor
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    env_file: ../.env
    environment:
      DB_PATH: /data/xhs-monitor.sqlite
    volumes:
      - ${XHS_DATA_DIR:-/var/lib/xhs-monitor}:/data
    restart: unless-stopped
    init: true
    user: "10001:10001"
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
    mem_limit: 768m
    networks: [internal]
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: ../.env
    environment:
      DB_PATH: /data/xhs-monitor.sqlite
    volumes:
      - ${XHS_DATA_DIR:-/var/lib/xhs-monitor}:/data
    restart: unless-stopped
    init: true
    user: "10001:10001"
    shm_size: "512mb"
    mem_limit: 1536m
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./deploy/seccomp_profile.json"
    networks: [internal]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  caddy_data:
  caddy_config:
